name: DropConnect CI Pipeline

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test and Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Automated Unit & Rule Tests
        run: pnpm test

      - name: Verify Backend Build
        run: pnpm --filter @dropconnect/backend build

      - name: Verify Frontend Typecheck
        run: pnpm --filter @dropconnect/frontend exec tsc --noEmit
